# Isolated demonstration only; never apply this override to the production release.
catalogService:
  create: true
postgresIntegration:
  enabled: true
  secretName: boutique-integration
  demoDataEnabled: true
  cookieSecure: false # The lab load balancer serves plain HTTP (no domain or TLS certificate).
  database:
    create: true
    storageClassName: boutique-ebs-gp3
frontend:
  # Public HTTP link for class demos: EKS creates a Classic ELB with LabRole.
  # It keeps billing while the Lab is stopped; set false to remove it.
  externalService: true
operations:
  # El CD crea boutique-operations (CA + dirección privada de Vault) y el
  # ConfigMap con scripts/operations_report.py antes de Helm.
  collector:
    enabled: true
loadGenerator:
  create: false
