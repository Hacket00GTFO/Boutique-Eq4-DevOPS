# Backend del catalogo del Admin Panel (Modulo 0/1). A diferencia de los
# demas servicios de este chart (gRPC), catalogservice habla HTTP/REST, por
# eso usa httpGet en los probes en vez de grpc.
{{- if .Values.catalogService.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.catalogService.name }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.catalogService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.catalogService.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.catalogService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.catalogService.name }}
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: {{ .Values.catalogService.name }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      terminationGracePeriodSeconds: 5
      {{- if .Values.securityContext.enable }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        {{- if .Values.seccompProfile.enable }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      {{- end }}
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: {{ .Values.images.repository }}/{{ .Values.catalogService.name }}:{{ .Values.images.tag | default .Chart.AppVersion }}
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: TABLE_NAME
          value: {{ .Values.catalogService.tableName | quote }}
        - name: AWS_REGION
          value: {{ .Values.catalogService.awsRegion | quote }}
        readinessProbe:
          periodSeconds: 5
          httpGet:
            path: /healthz
            port: 8080
        livenessProbe:
          periodSeconds: 5
          httpGet:
            path: /healthz
            port: 8080
        resources:
          {{- toYaml .Values.catalogService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.catalogService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.catalogService.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.catalogService.name }}
  ports:
  - name: http
    port: 80
    targetPort: 8080
{{- end }}
