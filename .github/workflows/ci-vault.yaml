name: Vault security and delivery checks
on:
  pull_request:
    paths: ['scripts/aws/**', 'scripts/vault/**', 'scripts/operations_report.py', 'scripts/tests/**', 'infrastructure/vault/**', 'ansible/**', 'terraform/aws/vault/**', 'helm-chart/**', '.github/workflows/ci-vault.yaml', '.github/workflows/cd-helm-eks.yaml', '.github/workflows/ci-docker-ecr.yaml']
  push:
    branches: [main]
    paths: ['scripts/aws/**', 'scripts/vault/**', 'scripts/operations_report.py', 'scripts/tests/**', 'infrastructure/vault/**', 'ansible/**', 'terraform/aws/vault/**', 'helm-chart/**', '.github/workflows/ci-vault.yaml', '.github/workflows/cd-helm-eks.yaml', '.github/workflows/ci-docker-ecr.yaml']
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install validation dependencies
        run: |
          pip install -r ansible/requirements.txt
          python -m pip check
      - name: Download verified Vault test binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://releases.hashicorp.com/vault/2.2.0/vault_2.2.0_linux_amd64.zip --output "$RUNNER_TEMP/vault.zip"
          printf '%s  %s\n' 05d78b0ac842ca7c522fc297df91527cd43c15420c4c5c0a969d48a7b0ff7b6d "$RUNNER_TEMP/vault.zip" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/vault-bin"
          unzip -q "$RUNNER_TEMP/vault.zip" -d "$RUNNER_TEMP/vault-bin"
          echo "VAULT_TEST_BINARY=$RUNNER_TEMP/vault-bin/vault" >> "$GITHUB_ENV"
      - name: Real Vault TLS, KV, ACL, expiration, seal and delivery recovery
        run: python -m unittest discover -s scripts/vault/tests -v
      - name: Direct AWS account boundary, node recovery and existing application custody
        run: python -m unittest discover -s scripts/aws/tests -v
      - name: Operations callback privacy and bounded output
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate automation
        working-directory: ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook -i 'localhost,' site.yml --syntax-check
          ansible-playbook -i 'localhost,' local-check.yml --syntax-check
          ansible-playbook -i 'localhost,' root-recovery.yml --syntax-check
          ansible-lint site.yml local-check.yml root-recovery.yml roles/*/tasks/main.yml roles/*/handlers/main.yml
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: Validate Helm and rollout behavior
        run: python scripts/vault/validate_chart.py
      - name: Validate Bash syntax
        run: |
          bash -n scripts/vault/install-ssm-plugin.sh
          bash -n scripts/vault/rebuild-lab.sh
