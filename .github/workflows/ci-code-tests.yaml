name: Unit tests for the release SHA
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  code-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: |
            src/shippingservice/go.sum
            src/productcatalogservice/go.sum
            src/frontend/go.sum
      - name: Download Go modules with bounded retries
        run: |
          set -euo pipefail
          for service in shippingservice productcatalogservice frontend; do
            pushd "src/$service"
            for attempt in 1 2 3; do
              if go mod download; then break; fi
              if [[ "$attempt" == 3 ]]; then exit 1; fi
              sleep "$((attempt * 5))"
            done
            popd
          done
      - name: Go unit tests
        run: |
          set -euo pipefail
          for package in shippingservice productcatalogservice frontend/validator; do
            pushd "src/$package"
            go test ./...
            popd
          done
      - name: C# unit tests
        run: dotnet test src/cartservice/
