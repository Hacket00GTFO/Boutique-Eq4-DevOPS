name: "CI: Docker build & push a ECR"

# Every merged development -> main PR deploys, including documentation-only PRs.
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: boutique-aws-release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'development' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
    steps:
      - name: Resolve immutable merged release
        id: release
        env:
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "image_tag=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.image_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release already present in main
        env:
          RELEASE_SHA: ${{ steps.release.outputs.image_tag }}
        run: git merge-base --is-ancestor "$RELEASE_SHA" origin/main
  integration:
    needs: release
    uses: ./.github/workflows/ci-postgres-integration.yaml
    with:
      ref: ${{ needs.release.outputs.image_tag }}
  vault-security:
    needs: release
    uses: ./.github/workflows/ci-vault.yaml
    with:
      ref: ${{ needs.release.outputs.image_tag }}
  build-and-push:
    needs: [release, integration, vault-security]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: adservice, context: src/adservice }
          - { name: cartservice, context: src/cartservice/src }
          - { name: catalogservice, context: src/catalogservice }
          - { name: checkoutservice, context: src/checkoutservice }
          - { name: currencyservice, context: src/currencyservice }
          - { name: emailservice, context: src/emailservice }
          - { name: frontend, context: src/frontend }
          - { name: loadgenerator, context: src/loadgenerator }
          - { name: paymentservice, context: src/paymentservice }
          - { name: productcatalogservice, context: src/productcatalogservice }
          - { name: recommendationservice, context: src/recommendationservice }
          - { name: shippingservice, context: src/shippingservice }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.image_tag }}
          persist-credentials: false

      - name: Configurar credenciales de AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login a ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: boutique-eq4/${{ matrix.service.name }}
          BUILD_CONTEXT: ${{ matrix.service.context }}
          IMAGE_TAG: ${{ needs.release.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/$REPO:$IMAGE_TAG" -t "$REGISTRY/$REPO:latest" "$BUILD_CONTEXT"
          docker push "$REGISTRY/$REPO:$IMAGE_TAG"
          docker push "$REGISTRY/$REPO:latest"

  deploy:
    needs: [release, build-and-push]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd-helm-eks.yaml
    with:
      image_tag: ${{ needs.release.outputs.image_tag }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
