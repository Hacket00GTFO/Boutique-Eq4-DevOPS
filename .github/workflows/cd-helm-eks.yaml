name: "CD: Helm deploy a EKS"

# Called by the merge pipeline only after every immutable ECR image was pushed.
on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: "SHA completo de una release ya construida en ECR"
        required: true
        type: string

permissions:
  contents: read

jobs:
  vault-lab-deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    permissions:
      contents: read
      id-token: write
    environment: vault-lab
    concurrency:
      group: boutique-vault-lab-deploy
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      VAULT_ADDR: https://127.0.0.1:18200
      VAULT_CACERT: ${{ github.workspace }}/.vault-lab/certs/${{ vars.VAULT_INSTANCE_ID }}.pem
      DATA_RECOVERY_VERIFIED: ${{ vars.DATA_RECOVERY_VERIFIED }}
      VAULT_AUTOMATION_READY: ${{ vars.VAULT_AUTOMATION_READY }}
      VAULT_INSTANCE_ID: ${{ vars.VAULT_INSTANCE_ID }}
      VAULT_SSM_BUCKET: ${{ vars.VAULT_SSM_BUCKET }}
      VAULT_KMS_KEY_ARN: ${{ vars.VAULT_KMS_KEY_ARN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.image_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an immutable release from main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full release SHA is required'; exit 1; }
          git merge-base --is-ancestor "$IMAGE_TAG" origin/main
      - name: Require verified data recovery and Vault/KMS/OIDC/TLS configuration
        run: python3 scripts/vault/require_automation.py configuration
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Verify the target account and enabled native KMS key
        run: python3 scripts/vault/require_automation.py cloud
      - name: Resume existing Lab instances and wait for SSM
        env:
          VAULT_INSTANCE_ID: ${{ vars.VAULT_INSTANCE_ID }}
          VAULT_KMS_KEY_ARN: ${{ vars.VAULT_KMS_KEY_ARN }}
        run: python scripts/vault/resume_lab.py --instance-id "$VAULT_INSTANCE_ID"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned Ansible dependencies and SSM plugin
        run: |
          python -m pip install -r ansible/requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml
          bash scripts/vault/install-ssm-plugin.sh
      - name: Apply persistent Vault configuration through Ansible
        working-directory: ansible
        env:
          ANSIBLE_SSM_BUCKET: ${{ vars.VAULT_SSM_BUCKET }}
          VAULT_INSTANCE_ID: ${{ vars.VAULT_INSTANCE_ID }}
        run: |
          set -euo pipefail
          [[ "$VAULT_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]
          test -n "$ANSIBLE_SSM_BUCKET"
          ansible-playbook site.yml --limit "$VAULT_INSTANCE_ID" -e vault_require_kms=true
      - name: Read the public trust certificate fetched through authenticated SSM
        id: trust
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          certificate = Path(os.environ['VAULT_CACERT']).read_bytes()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ca=' + base64.b64encode(certificate).decode() + '\n')
          PY
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.9
      - name: Resolve ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Verify images and persistent storage driver
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name boutique-eq4-eks --region us-east-1
          python scripts/vault/require_automation.py cluster
          for service in adservice cartservice catalogservice checkoutservice currencyservice emailservice frontend loadgenerator paymentservice productcatalogservice recommendationservice shippingservice; do
            aws ecr describe-images --repository-name "boutique-eq4/$service" --image-ids "imageTag=$IMAGE_TAG" >/dev/null
          done
          kubectl get namespace boutique-vault-lab >/dev/null
      - name: Open SSM tunnel and verify Vault TLS
        env:
          VAULT_INSTANCE_ID: ${{ vars.VAULT_INSTANCE_ID }}
        shell: bash
        run: bash scripts/vault/tunnel.sh start
      - name: Read application secrets from Vault
        id: vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://127.0.0.1:18200
          method: jwt
          path: github
          role: boutique-main
          jwtGithubAudience: ${{ github.server_url }}/${{ github.repository }}
          caCertificate: ${{ steps.trust.outputs.ca }}
          tlsSkipVerify: false
          exportEnv: false
          exportToken: false
          outputToken: false
          ignoreNotFound: false
          secrets: secret/data/boutique/lab/integration * | BOUTIQUE_
      - name: Deliver Secret, migrate, deploy and verify functionality
        id: delivery
        env:
          DATABASE_URL: ${{ steps.vault.outputs.BOUTIQUE_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ steps.vault.outputs.BOUTIQUE_MIGRATION_DATABASE_URL }}
          APP_DB_PASSWORD: ${{ steps.vault.outputs.BOUTIQUE_APP_DB_PASSWORD }}
          ADMIN_EMAIL: ${{ steps.vault.outputs.BOUTIQUE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ steps.vault.outputs.BOUTIQUE_ADMIN_PASSWORD }}
          ADMIN_API_TOKEN: ${{ steps.vault.outputs.BOUTIQUE_ADMIN_API_TOKEN }}
          CATALOG_READ_TOKEN: ${{ steps.vault.outputs.BOUTIQUE_CATALOG_READ_TOKEN }}
          CHECKOUT_API_TOKEN: ${{ steps.vault.outputs.BOUTIQUE_CHECKOUT_API_TOKEN }}
          POSTGRES_PASSWORD: ${{ steps.vault.outputs.BOUTIQUE_POSTGRES_PASSWORD }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: python scripts/vault/deploy.py --registry "$ECR_REGISTRY" --image-tag "$IMAGE_TAG" --revision "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
      - name: Close remote SSM session and remove temporary trust files
        if: always()
        shell: bash
        run: bash scripts/vault/tunnel.sh stop
      - name: Report deployment and smoke status
        if: always()
        env:
          DELIVERY_RESULT: ${{ steps.delivery.outcome }}
        run: |
          {
            echo '## EKS deployment'
            echo "Release SHA: $IMAGE_TAG"
            echo "Helm, migrations and functional smoke: ${DELIVERY_RESULT:-not executed}"
            echo 'Recovery results, when needed, are recorded by the delivery step.'
          } >> "$GITHUB_STEP_SUMMARY"
