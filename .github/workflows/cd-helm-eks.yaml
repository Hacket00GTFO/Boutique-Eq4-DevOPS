name: "CD: Helm deploy a EKS"

# Direct AWS authentication; the caller has already built every image for this SHA.
on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: "SHA completo de una release ya construida en ECR"
        required: true
        type: string

permissions:
  contents: read

jobs:
  helm-deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'development' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    concurrency:
      group: boutique-eks-helm-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.image_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an immutable release from main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full release SHA is required'; exit 1; }
          git merge-base --is-ancestor "$IMAGE_TAG" origin/main
      - name: Connect directly with the three AWS repository secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Resume only the existing EKS node instances
        run: python3 scripts/aws/direct_release.py resume-nodes
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: Resolve ECR registry in the connected account
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Verify built images and persistent storage
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name boutique-eq4-eks --region us-east-1
          kubectl wait --for=condition=Ready nodes --all --timeout=600s
          aws eks describe-addon --cluster-name boutique-eq4-eks --addon-name aws-ebs-csi-driver --query 'addon.status' --output text | grep -qx ACTIVE
          for service in adservice cartservice catalogservice checkoutservice currencyservice emailservice frontend paymentservice productcatalogservice recommendationservice shippingservice; do
            aws ecr describe-images --repository-name "boutique-eq4/$service" --image-ids "imageTag=$IMAGE_TAG" >/dev/null
          done
          kubectl get namespace boutique-vault-lab >/dev/null
      - name: Deploy with the existing Kubernetes application Secret and verify functionality
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: >-
          python3 scripts/aws/direct_release.py deploy
          --registry "$ECR_REGISTRY" --image-tag "$IMAGE_TAG"
          --revision "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
