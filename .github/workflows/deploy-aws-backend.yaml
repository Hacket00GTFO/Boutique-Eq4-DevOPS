name: "Deploy AWS Data Layer (Terraform)"

# Despliega la capa de datos del Admin Panel (hoy: la tabla DynamoDB de
# catalogo) a la cuenta de AWS Academy Learner Lab del equipo. El computo
# (contenedores) vive aparte, en terraform/aws/k8s + el workflow de Helm/EKS.
#
# Requiere estos secrets en el repo (Settings > Secrets and variables >
# Actions), refrescados cada vez que se reinicia la sesion del Learner Lab:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_SESSION_TOKEN
# Y este secret, que solo se define una vez (lo crea terraform/aws/bootstrap):
#   TF_STATE_BUCKET
on:
  push:
    branches: [main]
    paths:
      - "terraform/aws/**"
      - "!terraform/aws/k8s/**"
      - "!terraform/aws/vault/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: boutique-aws-data-layer
  cancel-in-progress: false
  queue: max

jobs:
  terraform-apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: Configurar credenciales de AWS (Learner Lab)
        id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Require the target AWS account
        env:
          AWS_ACCOUNT: ${{ steps.aws.outputs.aws-account-id }}
        run: test "$AWS_ACCOUNT" = 716142453772

      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET"
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
