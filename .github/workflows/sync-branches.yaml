# Sync branches derived from development.
#
# Trigger: a Pull Request is merged INTO development.
# For every branch B that derives from development (i.e. B's merge-base with
# development is a commit that is NOT reachable from main, meaning B forked
# from development's own history), open an automatic PR from a temp branch
# (merge of development into B) back into B. Branches with merge conflicts
# are skipped and reported in the job summary; they require manual
# resolution.

name: "Sync development into derived branches"

on:
  pull_request:
    # run when a PR targeting development is closed
    branches:
      - development
    types:
      - closed
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'kustomize/**'
      - '.github/workflows/kustomize-build-ci.yaml'
      - 'terraform/**'
      - '.github/workflows/terraform-validate-ci.yaml'
      - 'helm-chart/**'
      - '.github/workflows/helm-chart-ci.yaml'

# Only one sync run at a time per PR target
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync-branches:
    # only when the PR was actually merged (not just closed)
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout development (post-merge)
        uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch all remote branches
        run: |
          git fetch --prune origin
          # Print the list of origin branches for debugging
          git for-each-ref --format='%(refname:short)' refs/remotes/origin/

      - name: Sync development into derived branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Branches we never want to sync into
          SKIP_PATTERN='^(main|development|release/.*|gh-pages)$'

          # Collect results for the job summary
          SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          {
            echo "## Sync development into derived branches"
            echo ""
            echo "Source: \`development\` @ $(git rev-parse --short origin/development)"
            echo ""
            echo "| Branch | Status | PR |"
            echo "| --- | --- | --- |"
          } >> "$SUMMARY_FILE"

          # Iterate over the branch heads that exist on origin. ls-remote
          # returns real branches only, so the origin/HEAD symref, upstream/*
          # and local refs are never picked up.
          for BRANCH in $(git ls-remote --heads origin | sed 's|.*refs/heads/||'); do
            # Skip protected branches
            if [[ "$BRANCH" =~ $SKIP_PATTERN ]]; then
              continue
            fi

            # Skip sync/* temp branches created by this very workflow
            if [[ "$BRANCH" == sync/* ]]; then continue; fi

            echo "::group::Branch: $BRANCH"

            # Verify the branch derives from development: its merge-base with
            # development must be a commit that is not reachable from main.
            # (A branch forked from main shares a merge-base that IS in main.)
            MB_DEV=$(git merge-base origin/development "origin/$BRANCH" || true)
            if [ -z "$MB_DEV" ]; then
              echo "  $BRANCH shares no history with development. Skipping."
              echo "| \`$BRANCH\` | Skipped (unrelated history) | — |" >> "$SUMMARY_FILE"
              echo "::endgroup::"
              continue
            fi
            if git merge-base --is-ancestor "$MB_DEV" origin/main; then
              echo "  $BRANCH does NOT derive from development (fork point is reachable from main). Skipping."
              echo "| \`$BRANCH\` | Skipped (not derived from development) | — |" >> "$SUMMARY_FILE"
              echo "::endgroup::"
              continue
            fi

            # Check if branch is already up to date with development
            if [ "$(git rev-parse origin/development)" = "$MB_DEV" ]; then
              # development HEAD is reachable from B => B already contains everything in development
              echo "  $BRANCH is already up to date with development. Skipping."
              echo "| \`$BRANCH\` | Already up to date | — |" >> "$SUMMARY_FILE"
              echo "::endgroup::"
              continue
            fi

            # Create a temp branch from B and merge development into it
            TEMP_BRANCH="sync/development-to-${BRANCH//\//-}"
            git branch -D "$TEMP_BRANCH" 2>/dev/null || true
            git checkout -b "$TEMP_BRANCH" "origin/$BRANCH"

            if git merge --no-edit --no-ff origin/development; then
              # No conflicts: push temp branch (plain --force; --force-with-lease
              # refuses when there is no remote-tracking ref for a brand-new
              # sync/* branch) and open/update PR
              if ! git push --force origin "$TEMP_BRANCH"; then
                echo "  Failed to push $TEMP_BRANCH. Skipping."
                echo "| \`$BRANCH\` | ⚠️ Push failed | — |" >> "$SUMMARY_FILE"
                git checkout development
                git branch -D "$TEMP_BRANCH" 2>/dev/null || true
                echo "::endgroup::"
                continue
              fi

              # Check if a PR already exists for this head/base pair
              EXISTING_PR=$(gh pr list \
                --head "$TEMP_BRANCH" \
                --base "$BRANCH" \
                --state open \
                --json number \
                --jq '.[0].number // empty' \
                || echo "")

              PR_BODY=":robot: Automated sync PR from \`development\` into \`$BRANCH\`.

          This PR was created by the \`sync-branches\` workflow after a PR was merged into \`development\`.

          - Source: \`development\` @ $(git rev-parse --short origin/development)
          - Target: \`$BRANCH\`
          - Triggering PR: #${{ github.event.pull_request.number }}

          Review the diff and merge to keep \`$BRANCH\` in sync with \`development\`."

              if [ -n "$EXISTING_PR" ]; then
                echo "  Updating existing PR #$EXISTING_PR ($TEMP_BRANCH -> $BRANCH)"
                if gh pr edit "$EXISTING_PR" --body "$PR_BODY"; then
                  echo "| \`$BRANCH\` | Updated existing PR | #$EXISTING_PR |" >> "$SUMMARY_FILE"
                else
                  echo "| \`$BRANCH\` | ⚠️ PR update failed | — |" >> "$SUMMARY_FILE"
                fi
              else
                NEW_PR=$(gh pr create \
                  --head "$TEMP_BRANCH" \
                  --base "$BRANCH" \
                  --title "chore: sync development into ${BRANCH}" \
                  --body "$PR_BODY" \
                  --json number \
                  --jq '.number' \
                  || echo "")
                if [ -n "$NEW_PR" ]; then
                  echo "  Opened PR #$NEW_PR ($TEMP_BRANCH -> $BRANCH)"
                  echo "| \`$BRANCH\` | Opened PR | #$NEW_PR |" >> "$SUMMARY_FILE"
                else
                  echo "  Failed to open PR ($TEMP_BRANCH -> $BRANCH)"
                  echo "| \`$BRANCH\` | ⚠️ PR creation failed | — |" >> "$SUMMARY_FILE"
                fi
              fi
            else
              # Merge conflict: abort, skip, and report
              git merge --abort
              echo "  $BRANCH has merge conflicts with development. Skipping (manual merge required)."
              echo "| \`$BRANCH\` | ⚠️ Conflict — manual merge required | — |" >> "$SUMMARY_FILE"
            fi

            # Back to development for the next iteration
            git checkout development
            git branch -D "$TEMP_BRANCH" 2>/dev/null || true
            echo "::endgroup::"
          done

          echo "" >> "$SUMMARY_FILE"
          echo "_Done. Branches marked with ⚠️ require manual conflict resolution._" >> "$SUMMARY_FILE"
