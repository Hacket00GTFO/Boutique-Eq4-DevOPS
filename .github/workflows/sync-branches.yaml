name: Sync development into team branches

on:
  pull_request:
    branches: [development]
    types: [closed]
  workflow_dispatch: {}

# All runs write the same destinations. Queue across PRs and include all paths.
concurrency:
  group: branch-sync-development
  cancel-in-progress: false

jobs:
  sync-branches:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout development
        uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Sync David and Norberto
        run: python3 scripts/branch-sync/sync.py --target David --target Norberto --push
