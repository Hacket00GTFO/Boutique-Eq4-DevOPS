- name: Install hardened systemd service
  ansible.builtin.template:
    src: vault.service.j2
    dest: /etc/systemd/system/vault.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Vault
- name: Enable Vault service
  ansible.builtin.systemd_service:
    name: vault
    daemon_reload: true
    enabled: true
    state: started
